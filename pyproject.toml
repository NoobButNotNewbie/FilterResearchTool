[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filtertool"
version = "0.1.0"
description = "Local literature screening & research mapping pipeline for LLM security research"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "sentence-transformers>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.65",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
filtertool = "filtertool.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
